<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bekräfta din e-post</title>
</head>
<!--
  Supabase Auth (GoTrue) "Confirm signup". Endast länken ({{ .ConfirmationURL }});
  engångskoden togs bort 2026-10-10. Den aktuella mallen genereras
  av `manage.py build_auth_email_templates` till
  taxitips-web/public/email/confirmation.html; den här filen är kvar för äldre
  referenser (se docs/epost-otp.md). Inline-stilar: e-postklienter läser inte
  <style> pålitligt.
-->
<body style="margin:0;padding:0;background:#F5F7FA;font-family:Inter,Arial,Helvetica,sans-serif;color:#14213D;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F7FA;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border-radius:16px;overflow:hidden;">
          <tr>
            <td style="background:#14213D;padding:24px 28px;color:#F5F7FA;font-size:20px;font-weight:800;">
              taxi<span style="color:#FCA311;">tips</span>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;">
              <h1 style="margin:0 0 8px;font-size:22px;line-height:1.3;">Bekräfta din e-post</h1>
              <p style="margin:0 0 20px;font-size:16px;line-height:1.5;color:#526078;">
                Välkommen till Taxi Tips! Tryck på knappen för att bekräfta {{ .Email }} och slutföra registreringen.
              </p>
              <p style="margin:0 0 20px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FCA311;color:#14213D;font-weight:700;text-decoration:none;padding:14px 28px;border-radius:999px;">Bekräfta e-post</a>
              </p>
              <p style="margin:0;font-size:13px;line-height:1.5;color:#8A93A3;">
                Var det inte du? Då kan du strunta i mejlet och inget händer.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
