# Lokal utveckling för taxitips-backend.
#
# EN databas, och den ligger inte här: `supabase start` (från taxitips-api/)
# måste köra separat. Django ansluter dit via DATABASE_URL och äger
# pipeline-tabellerna (source_events, opportunities, scoring_rule, ...) genom
# sina egna migrationer; Supabases SQL-migrationer äger domäntabellerna
# (companies, devices, profiles, ...). Ingen tabell beskrivs på två ställen.
#
# Här fanns tidigare en egen Postgres+TimescaleDB-container. Den är borta med
# avsikt: den gjorde att allt pipelinen räknade ut hamnade i en databas som
# ingen förare läste från.

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", ""]
    ports:
      # Bunden till localhost, inte 0.0.0.0 -- öppen för host-sidig utveckling
      # (manage.py/celery direkt på värden), inte för nätverket.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build: .
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
